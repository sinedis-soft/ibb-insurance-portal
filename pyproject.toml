[project]
name = "ibb-insurance-portal"
version = "0.1.0"
description = "IBB Insurance Portal backend MVP foundation"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "argon2-cffi>=25.0,<26.0",
    "email-validator>=2.2,<3.0",
    "fastapi>=0.111,<1.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "PyJWT>=2.9,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.3,<3.0",
    "redis>=5.0,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "PyYAML>=6.0,<7.0",
    "ruff>=0.5,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/reference_data.py" = ["E501"]
