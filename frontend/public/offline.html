<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IBB Insurance Portal — offline</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: light; --bg:#f7f4ec; --panel:#fff; --text:#1e2933; --muted:#5f6f7d; --primary:#2f6f8f; --border:#d9eef6; --accent:#b8945a; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      main { width:min(100%, 520px); background:var(--panel); border:1px solid var(--border); border-radius:16px; box-shadow:0 18px 45px rgb(30 41 51 / 9%); padding:28px; }
      .brand { color:var(--accent); font-family:Georgia,"Times New Roman",serif; font-size:28px; margin:0 0 16px; }
      h1 { color:var(--primary); font-size:28px; line-height:1.15; margin:0 0 12px; }
      p { color:var(--muted); font-size:16px; line-height:1.5; margin:0 0 12px; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">IBB</p>
      <h1>Нет соединения с интернетом</h1>
      <p>Портал не сохраняет и не показывает приватные данные из offline-кэша.</p>
      <p>Восстановите подключение и повторите действие. Сохранение, отправка заявок и загрузка документов недоступны без сети.</p>
    </main>
  </body>
</html>
